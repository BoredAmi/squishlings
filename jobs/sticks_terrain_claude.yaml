# Generalists with the language model as a second mutation operator: sticks_terrain.yaml plus the llm block of
# sticks_map_llm.yaml; the model's prompt says what the creatures are scored on. Needs ollama (qwen3.5:9b).
#   squishlings evolve jobs/sticks_terrain_llm.yaml --jobs 8
scenario: ../squishlings/creatures/base.yaml
backend: mujoco
genome:
  encoding: sticks
  tissues: [ecoflex_00_30, dragon_skin_10]
  muscle: {groups: 4, frequency: [1 Hz, 12 Hz], amplitude: [2 kPa, 30 kPa], start: 0.3 s}
  max_segments: 10
  length: [8 mm, 30 mm]
  radius: [3 mm, 7 mm]
  mesh_size: 3 mm
evolution: {method: map_elites, population: 32, offspring: 16, generations: 38, crossover: 0.3, seed: 3,
            llm: {model: "claude-opus", url: "http://localhost:11500", rate: 0.5, examples: 3, timeout: 21600}}
archive:
  descriptors: [limbs, elongation]
  bins: [6, 5]
  ranges: [[0, 6], [-1, 3]]
  per_terrain: true            # also the best of each kind on each ground alone (archive_<ground>.png)
terrains:                     # each creature: flat ground, then these three (squishlings/terrain.py)
  slope: {angle: 8 deg}       # uphill along its own flat heading
  ridges: {height: 3 mm, width: 6 mm, spacing: 40 mm, extent: 1.5 m}
  sand: {timeconst: 20 ms}    # soft damped ground, sinks about 3 mm
fitness: {metric: terrain_mean}
seeds:
  - ../squishlings/creatures/sticks/inchworm.txt
  - ../squishlings/creatures/sticks/walker.txt
  - ../squishlings/creatures/sticks/champion_1.txt
output: ../runs/sticks_terrain_claude
